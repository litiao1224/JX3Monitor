            <div class="content-header">

                <!-- Path & Folder Settings -->

                    <div class="section-header">
                        <h2 class="section-title">路径与文件夹</h2>
                        <p class="section-description">用于查看本地记录和导出数据</p>
                    </div>

                    <div class="settings-group">
                        <div class="form-field">
                            <label class="form-label">游戏路径</label>
                            <div class="input-group">
                                <input type="text" class="form-input" placeholder="F:\JX3\Game\JX3\bin\zhcn_hd" value="F:\JX3\Game\JX3\bin\zhcn_hd">
                                <button class="btn btn-secondary">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                                    </svg>
                                    浏览
                                </button>
                            </div>
                            <p class="form-hint">剑网3安装目录下的 zhcn_hd 文件夹</p>
                        </div>

                        <div class="form-field">
                            <label class="form-label">输出目录</label>
                            <div class="input-group">
                                <input type="text" class="form-input" placeholder="默认: 程序目录/runs/live" value="">
                                <button class="btn btn-secondary">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                                    </svg>
                                    浏览
                                </button>
                            </div>
                            <p class="form-hint">留空则使用程序目录下的 runs/live 文件夹</p>
                        </div>

                        <div class="form-actions">
                            <button class="btn btn-primary">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M5 12h14M12 5l7 7-7 7"/>
                                </svg>
                                打开 live 文件夹
                            </button>
                        </div>
                    </div>
                </section>
